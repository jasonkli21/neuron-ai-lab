[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "neuron-lab"
version = "0.1.0"
description = "A compact computational neuroscience laboratory, beginning with a leaky integrate-and-fire neuron."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "ipywidgets>=8.1",
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "numpy>=2.0",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neuron_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["neuron_lab"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
